# Publishes the documentation website (docs/index.html and the two built Quarto books) to GitHub Pages.
# Only the built pages are published, not the qmd sources. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Publish docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/CPAT_full_documentation_html/**'
      - 'docs/CPAT_ai_documentation_html/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Assemble the site
        run: |
          mkdir _site
          cp docs/index.html _site/
          cp -r docs/CPAT_full_documentation_html docs/CPAT_ai_documentation_html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
