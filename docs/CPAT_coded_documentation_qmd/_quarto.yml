        - 05_Editing.qmd
        - 06_Testing.qmd
    - part: "Part II: How it works"
      chapters:
        - 07_Architecture.qmd
        - 08_Mitigation_blocks.qmd
        - 09_Distribution.qmd
        - 10_App.qmd
        - 11_Versions.qmd
  appendices:
    - A_Equations.qmd
    - B_Equations_codes.qmd
    - C_Database_tables.qmd
    - D_Inputs.qmd
    - E_Variables.qmd
    - F_Bugs.qmd
    - G_Spec.qmd
    - H_Norms.qmd
    - I_Plan.qmd
    - J_Glossary.qmd

format:
  html:
    toc-depth: 3
