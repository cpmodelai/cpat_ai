  - {symbol: "Y", code: "gdp.pos.usd", meaning: "Real GDP (baseline $Y^0$)", unit: "USD bn real", from: "M"}
  - {symbol: "p", code: "atp", meaning: "After-tax (retail) price", unit: "USD/GJ", from: "M"}
